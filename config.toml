baseURL = "https://bhagwadgita.info/"
locale = "en-us"
title = "श्रीमद् भगवद्गीता"
theme = "book"
publishDir = "docs"

# robots.txt is generated from themes/book/layouts/robots.txt
enableRobotsTXT = true

# Verse pages are the content; the tag/category taxonomies were never used and
# only produced empty pages for crawlers to index.
disableKinds = ["taxonomy", "term"]

[params]
	author = "baba"
	description = "Read the complete Srimad Bhagavad Gita online — Sanskrit shloka with Hindi and English translation and commentary."
	bio = ""

[sitemap]
	changefreq = "monthly"
	priority = 0.7

[markup.goldmark.renderer]
	unsafe = true

# Empty on purpose. The site loaded a dead Universal Analytics tag from 2023
# until 2026; it now measures nothing at all rather than pretending to. Paste a
# GA4 measurement id ("G-XXXXXXXXXX") here to turn collection back on.
googleAnalytics = ""
